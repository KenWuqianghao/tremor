[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tremor-tsbad"
dynamic = ["version"]
description = "Tremor: a CPU-only, label-free per-series chooser over MMPAD, Sub-PCA and a point-anomaly detector for the TSB-AD anomaly-detection benchmark"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ken Wu", email = "wooqianghao@gmail.com" }]
keywords = ["anomaly-detection", "time-series", "TSB-AD", "VUS-PR", "matrix-profile", "benchmark"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# What `import tremor` itself needs.  Confirmed by reading every import in tremor/:
#   numpy                      (tremor/fusion.py, point.py, point_m.py, detector.py, cli.py)
#   scipy.stats  rankdata, kurtosis      (tremor/fusion.py, point_m.py)
#   scipy.ndimage maximum_filter1d, uniform_filter1d   (tremor/point.py)
# Nothing else is imported at module level.  stumpy is NOT imported anywhere in tremor/ and
# NOT imported by the components Tremor calls either (MMPAD ships its own numpy mSTOMP in
# TSB_AD/models/mmpad/mstomp.py; Sub-PCA is scikit-learn PCA) -- it is only a transitive
# dependency of other TSB-AD detectors Tremor does not use, so it is not listed here.
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10",
]

[project.optional-dependencies]
# The three score components live in TSB-AD itself and are imported lazily by
# tremor.detector._components / tremor.point.period_of:
#   TSB_AD.model_wrapper.run_MMPAD          -> numpy mSTOMP + kNN discord profile
#   TSB_AD.model_wrapper.run_Sub_PCA        -> scikit-learn PCA over sliding windows
#   TSB_AD.utils.slidingWindows.find_length_rank -> statsmodels acf (the ACF period)
# and the CLI reads the benchmark's CSV layout with pandas and scores with
# TSB_AD.evaluation.metrics.get_metrics (the benchmark's own VUS-PR).
components = [
  "TSB-AD>=1.5",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "pandas>=1.5",
]
# Exact versions this repository's numbers were produced with (Python 3.11.15, Linux, 4 cores).
repro = [
  "numpy==1.26.4",
  "scipy==1.17.1",
  "scikit-learn==1.9.1",
  "statsmodels==0.15.0",
  "pandas==3.0.5",
]

[project.scripts]
tremor-score = "tremor.cli:main"

[project.urls]
Homepage = "https://github.com/KenWuqianghao/tremor"
Repository = "https://github.com/KenWuqianghao/tremor"
Benchmark = "https://github.com/TheDatumOrg/TSB-AD"

[tool.setuptools]
packages = ["tremor"]

[tool.setuptools.dynamic]
version = { attr = "tremor.__version__" }
